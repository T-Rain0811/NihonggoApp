<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>N2 合格 - Quốc Toàn</title>
  <meta name="description" content="N2 合格 - Ứng dụng học tiếng Nhật JLPT N2 cá nhân hóa bởi Quốc Toàn. Luyện từ vựng, ngữ pháp, flashcard 3D và Power Drill.">
  <meta name="theme-color" content="#0e2439">

  <!-- Apple iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N2 合格">
  <!-- Favicon & Apple Icon -->
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Be Vietnam Pro (Vietnamese) & Noto Sans JP (Japanese) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <div class="app-container">
    <!-- Desktop & Mobile Top Header -->
    <header class="header">
      <div class="header-inner">
        <div class="brand-logo" id="brand-link">
          <img src="assets/icon-192.png" alt="N2 合格 Icon" class="brand-app-icon" style="width: 42px; height: 42px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 12px rgba(10, 36, 68, 0.15); flex-shrink: 0;">
          <div class="brand-text-group">
            <span class="brand-name jp-font">N2 合格</span>
            <span class="brand-subname">JLPT N2</span>
          </div>
        </div>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav">
          <a class="nav-link active" data-target="home">Trang chủ</a>
          <a class="nav-link" data-target="vocab">Từ vựng</a>
          <a class="nav-link" data-target="grammar">Ngữ pháp</a>
          <a class="nav-link" data-target="custom">Sổ tay cá nhân</a>
          <a class="nav-link" data-target="drill">Luyện Drill</a>
          <a class="nav-link" data-target="extra">Mở rộng</a>
        </nav>

        <!-- Header Actions: Author badge -->
        <div class="header-actions">
          <div class="author-badge">
            <span class="author-dot"></span>
            <span class="author-text">Tác giả: <strong>Quốc Toàn</strong></span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Dynamic View Area -->
    <main class="main-content" id="view-container">
      <!-- Dynamic views rendered via JavaScript -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <a class="mobile-nav-item active" data-target="home">
        <span class="nav-icon">🏠</span>
        <span>Trang chủ</span>
      </a>
      <a class="mobile-nav-item" data-target="vocab">
        <span class="nav-icon">📚</span>
        <span>Từ vựng</span>
      </a>
      <a class="mobile-nav-item" data-target="grammar">
        <span class="nav-icon">✍️</span>
        <span>Ngữ pháp</span>
      </a>
      <a class="mobile-nav-item" data-target="custom">
        <span class="nav-icon">📝</span>
        <span>Sổ tay</span>
      </a>
      <a class="mobile-nav-item" data-target="drill">
        <span class="nav-icon">⚡</span>
        <span>Drill</span>
      </a>
    </nav>
  </div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/app.js?v=12"></script>
</body>
</html>
