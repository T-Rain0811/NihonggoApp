<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TŌあN - N2 合格祈願 </title>
  <meta name="description"
    content="TŌあN - Ứng dụng học tiếng Nhật JLPT N2 cá nhân hóa bởi Quốc Toàn. Luyện từ vựng, ngữ pháp, flashcard 3D và Power Drill.">
  <meta name="theme-color" content="#142B49">

  <!-- Apple iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TŌあN">
  <!-- Favicon & Apple Icon -->
  <link rel="icon" type="image/png" href="assets/logo_page.png">
  <link rel="apple-touch-icon" href="assets/logo_page.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Be Vietnam Pro (Vietnamese) & Noto Sans JP (Japanese) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=63">
</head>

<body>
  <div class="app-container">
    <!-- Desktop & Mobile Top Header -->
    <header class="header">
      <div class="header-inner">
        <div class="brand-logo" id="brand-link">
          <img src="assets/logo_full.png" alt="TŌあN Japanese Learning" class="brand-full-logo">
        </div>

        <!-- Header Right Actions: Desktop Nav + Settings Trigger -->
        <div class="header-right-actions">
          <!-- Desktop Navigation -->
          <nav class="desktop-nav">
            <a class="nav-link active" data-target="home">Trang chủ</a>
            <a class="nav-link" data-target="vocab">Từ vựng</a>
            <a class="nav-link" data-target="grammar">Ngữ pháp</a>
            <a class="nav-link" data-target="drill">Luyện Drill</a>
          </nav>

          <!-- Settings Button (Visible on both Desktop & Mobile) -->
          <button class="btn-settings-trigger" id="btn-open-settings" title="Cài đặt hệ thống & Đồng bộ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2v-.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2v.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span class="settings-dot" id="header-settings-dot"></span>
          </button>
        </div>

      </div>
    </header>

    <!-- Main Content Dynamic View Area -->
    <main class="main-content" id="view-container">
      <!-- Dynamic views rendered via JavaScript -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <a class="mobile-nav-item active" data-target="home">
        <span class="nav-icon">🏠</span>
        <span>Trang chủ</span>
      </a>
      <a class="mobile-nav-item" data-target="vocab">
        <span class="nav-icon">📚</span>
        <span>Từ vựng</span>
      </a>
      <a class="mobile-nav-item" data-target="grammar">
        <span class="nav-icon">✍️</span>
        <span>Ngữ pháp</span>
      </a>
      <a class="mobile-nav-item" data-target="drill">
        <span class="nav-icon">⚡</span>
        <span>Drill</span>
      </a>
    </nav>

    <!-- Floating Scroll To Top Button -->
    <button class="btn-scroll-top" id="btn-scroll-top" title="Cuộn lên đầu trang" aria-label="Cuộn lên đầu trang">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>
  </div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/app.js?v=63"></script>
</body>

</html>
